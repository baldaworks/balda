version: "3"

tasks:
  deps-update:
    desc: Update the Go modules specified in MODULES
    requires:
      vars: [MODULES]
    cmds:
      - 'go get{{range splitList " " .MODULES}} {{shellQuote .}}{{end}}'
      - go mod tidy

  vulncheck:
    desc: Scan reachable Go code for known vulnerabilities
    cmds:
      - go tool govulncheck ./...

  backoffice-preview:
    desc: Serve the synthetic Backoffice QA gallery
    cmds:
      - go run ./cmd/balda backoffice qa serve --listen 127.0.0.1:8096

  test:
    desc: Run Go tests with the race detector
    cmds:
      - go test -race {{if .PACKAGES}}{{range splitList " " .PACKAGES}}{{shellQuote .}} {{end}}{{else}}./...{{end}} {{if .RUN}}-run {{shellQuote .RUN}}{{end}}

  lint:
    desc: Run the Go linter
    cmds:
      - go tool golangci-lint run

  arch-lint:
    desc: Run architecture lint for internal/apps/balda
    cmds:
      - go tool go-arch-lint check --project-path .

  backoffice-e2e:
    desc: Provision Chromium and run the Backoffice browser regression suite
    cmds:
      - ./scripts/qa/run-backoffice-e2e.sh

  dev:
    desc: Run Balda with the embedded local runtime
    cmds:
      - ./scripts/dev/run-balda-embedded-runtime.sh

  scenarios:
    desc: Run fake ingress scenarios
    cmds:
      - ./scripts/dev/run-fake-ingress-scenarios.sh

  runtime-state:
    desc: Dump runtime stream and consumer state
    cmds:
      - ./scripts/dev/dump-runtime-state.sh

  projection-replay:
    desc: Replay events through the projection replay suite
    cmds:
      - ./scripts/dev/replay-events-into-projections.sh

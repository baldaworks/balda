balda:
  working_dir: ""
  state_dir: ".config/balda"
  logger:
    level: "info"
    pretty: true
  database:
    type: sqlite
    sqlite:
      path: '{{.StateDir}}/state.db'
    postgres:
      host: localhost
      port: 5432
      name: balda
      user: balda
      password: ""
      sslmode: disable
  backoffice:
    listen_addr: "127.0.0.1:8095"
    public_url: "http://127.0.0.1:8095"
    access_token_ttl: "15m"
    refresh_token_ttl: "12h"
    qa_ui: false

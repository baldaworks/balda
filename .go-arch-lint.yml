version: 3
workdir: .

allow:
  depOnAnyVendor: false

excludeFiles:
  - "^.*_test\\.go$"

exclude:
  - .config

components:
  # Extraction-ready session-memory values and semantic API. This package may
  # use only the standard library and must remain independent of Balda policy.
  session_memory_core:
    in:
      - sessionmemory

  # Portable application use cases and consumer-owned capability ports. This
  # package may depend on the core only and must remain free of Balda policy
  # and vendor runtime imports.
  session_memory_app:
    in:
      - sessionmemory/app

  # Canonical Badger truth and lifecycle adapter. The host supplies paths;
  # this component must not depend on Balda application policy.
  session_memory_badger:
    in:
      - sessionmemory/store/badger

  # Disposable lexical recall projection.  Bleve and its analyzers are
  # isolated here; canonical hydration and consistency policy remain in app.
  session_memory_bleve:
    in:
      - sessionmemory/index/bleve

  # Neutral MCP search/trace surface.  Scope resolution and authenticated
  # host context are injected; Balda transport policy stays outside.
  session_memory_mcp:
    in:
      - sessionmemory/mcp

  # Public deterministic test support for canonical adapter contracts.
  session_memory_contract_testkit:
    in:
      - sessionmemory/sessionmemorytest

  # Portable export wire contracts may depend only on the portable core.
  session_memory_contracts:
    in:
      - internal/apps/balda/sessionmemorycmd

  # Reusable in-process test support for provider consumers.
  session_memory_testkit:
    in:
      - internal/apps/balda/sessionmemorytest

  # Generic, reusable building blocks that must stay free of Balda product policy.
  foundation:
    in:
      - internal/git
      - internal/logging
      - internal/throttle

  # Wire contracts, payloads, envelope builders, and shared delivery/progress DTOs.
  contracts:
    in:
      - internal/apps/balda/attachment
      - internal/apps/balda/actorcmd
      - internal/apps/balda/automodecmd
      - internal/apps/balda/controlcmd
      - internal/apps/balda/chatapp
      - internal/apps/balda/commandapp
      - internal/apps/balda/deliverycmd
      - internal/apps/balda/deliveryfmt
      - internal/apps/balda/goalcmd
      - internal/apps/balda/goalkeepercmd
      - internal/apps/balda/goalresultcmd
      - internal/apps/balda/locatorref
      - internal/apps/balda/progress
      - internal/apps/balda/permissioncmd
      - internal/apps/balda/permissionfmt
      - internal/apps/balda/plugincmd
      - internal/apps/balda/progressfmt
      - internal/apps/balda/questioncmd
      - internal/apps/balda/questionfmt
      - internal/apps/balda/telegramref
      - internal/apps/balda/telegramfmt
      - internal/apps/balda/turncmd
      - internal/apps/balda/usageview

  # Narrow application-facing ports plus use-cases and orchestration services.
  application:
    in:
      - internal/apps/balda/agent
      - internal/apps/balda/appports
      - internal/apps/balda/auth
      - internal/apps/balda/automode
      - internal/apps/balda/controlapp
      - internal/apps/balda/sessionapp
      - internal/apps/balda/envelopetarget
      - internal/apps/balda/jobs
      - internal/apps/balda/jobexec
      - internal/apps/balda/ingressapp
      - internal/apps/balda/memory
      - internal/apps/balda/questions
      - internal/apps/balda/permissions
      - internal/apps/balda/pluginapp
      - internal/apps/balda/scheduledjobs
      - internal/apps/balda/session
      - internal/apps/balda/sessionmemorymcp
      - internal/apps/balda/sessionturn
      - internal/apps/balda/sessionturnapp
      - internal/apps/balda/sessionmemoryapp
      - internal/apps/balda/welcome

  # Product feature behavior. Feature subtrees stay here; they are not top-level architecture layers.
  domain:
    in:
      - internal/apps/balda/actors
      - internal/apps/balda/actors/**
      - internal/apps/balda/goalkeeperworkflow

  # Balda runtime policy and runtime host wiring.
  runtime:
    in:
      - internal/apps/balda/execution

  # Ingress only: parse/auth/session-check/publish.
  ingress:
    in:
      - internal/apps/balda/handlers

  # Composition adapters bind ingress-owned ports to concrete provider runtimes.
  ingress_wiring:
    in:
      - internal/apps/balda/handlersfx

  # Transport-neutral delivery use case and consumer-owned ports. Concrete
  # channel routing is composed in deliveryfx and must not leak back here.
  delivery_usecase:
    in:
      - internal/apps/balda/deliveryworkflow

  # Provider-facing delivery and rendering adapters.
  delivery:
    in:
      - internal/apps/balda/channel
      - internal/apps/balda/channel/**
      - internal/apps/balda/deliveryfx
      - internal/apps/balda/goaldelivery
      - internal/apps/balda/tgbotkit

  # Storage and adapter-heavy infrastructure that does not fit a narrower semantic layer.
  infrastructure:
    in:
      - internal/apps/balda
      - internal/apps/balda/attachmentstore
      - internal/apps/balda/controlmcp
      - internal/apps/balda/eventbus
      - internal/apps/balda/eventbus/**
      - internal/apps/balda/internalmcp
      - internal/apps/balda/paths
      - internal/apps/balda/agentplugin
      - internal/apps/balda/redaction
      - internal/apps/balda/shutdown
      - internal/apps/balda/state
      - internal/apps/sessionmcp
      - internal/apps/workspacemcp

  entrypoints:
    in:
      - cmd/balda

deps:
  session_memory_core:
    mayDependOn:
      - session_memory_core
    # The core receives application-owned model ports through canonical
    # processor constructors. The
    # import boundary remains stdlib-only; deep-scan's constructor injection
    # report would invert that intentional dependency-injection direction.
    deepScan: false
    anyVendorDeps: false

  session_memory_app:
    mayDependOn:
      - session_memory_core
      - session_memory_app
    # Hosts inject provider implementations through the portable invoker
    # interface at the composition root; deep-scan must not invert that port.
    deepScan: false
    anyVendorDeps: false

  session_memory_badger:
    mayDependOn:
      - session_memory_core
      - session_memory_app
      - session_memory_badger
    anyVendorDeps: true

  session_memory_bleve:
    mayDependOn:
      - session_memory_core
      - session_memory_app
      - session_memory_bleve
    anyVendorDeps: true

  session_memory_mcp:
    mayDependOn:
      - session_memory_core
      - session_memory_mcp
    anyVendorDeps: true

  session_memory_contract_testkit:
    mayDependOn:
      - session_memory_core
      - session_memory_contract_testkit
    anyVendorDeps: false

  session_memory_contracts:
    mayDependOn:
      - session_memory_core
    anyVendorDeps: false

  session_memory_testkit:
    mayDependOn:
      - session_memory_core
    anyVendorDeps: false

  foundation:
    anyProjectDeps: true
    anyVendorDeps: true

  contracts:
    mayDependOn:
      - foundation
      - contracts
      - application
      - delivery
      - infrastructure
    anyVendorDeps: true

  application:
    mayDependOn:
      - foundation
      - contracts
      - session_memory_core
      - session_memory_app
      - session_memory_badger
      - session_memory_bleve
      - session_memory_mcp
      - session_memory_contracts
      - application
      - infrastructure
    anyVendorDeps: true

  domain:
    mayDependOn:
      - foundation
      - contracts
      - application
      - domain
      - runtime
      - delivery_usecase
      - delivery
      - infrastructure
    anyVendorDeps: true

  runtime:
    mayDependOn:
      - foundation
      - contracts
      - runtime
    anyVendorDeps: true

  ingress:
    mayDependOn:
      - foundation
      - contracts
      - application

    anyVendorDeps: true

  ingress_wiring:
    mayDependOn:
      - contracts
      - ingress
      - delivery
      - infrastructure
    anyVendorDeps: true

  delivery_usecase:
    mayDependOn:
      - foundation
      - contracts
      - application
      - infrastructure
    anyVendorDeps: true

  delivery:
    mayDependOn:
      - foundation
      - contracts
      - application
      - delivery_usecase
      - delivery
      - runtime
      - infrastructure
    anyVendorDeps: true

  infrastructure:
    anyProjectDeps: true
    anyVendorDeps: true

  entrypoints:
    anyProjectDeps: true
    anyVendorDeps: true

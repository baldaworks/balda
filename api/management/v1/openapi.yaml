openapi: 3.0.3
info:
  title: Balda Management API
  version: 1.0.0
  description: >-
    Contract for the loopback Balda management API. The API distinguishes
    browser WebAuth authority from AI conversation sessions.
paths:
  /api/management/v1/compatibility:
    get:
      operationId: getManagementCompatibility
      summary: Read management contract compatibility metadata
      security:
        - operatorServiceAuth: []
      responses:
        "200":
          description: Management contract metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementCompatibility"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/login:
    post:
      operationId: loginWebAuth
      summary: Start local WebAuth login
      security:
        - operatorServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalLoginRequest"
      responses:
        "200":
          description: Login completed or requires an MFA continuation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthLoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/login/mfa:
    post:
      operationId: finishWebAuthLogin
      summary: Finish local WebAuth login with MFA
      security:
        - operatorServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthLoginMFAFinishRequest"
      responses:
        "200":
          description: Authenticated WebAuth credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthCredentials"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/refresh:
    post:
      operationId: refreshWebAuth
      summary: Rotate WebAuth credentials
      security:
        - operatorServiceAuth: []
          webAuthRefresh: []
          csrf: []
      responses:
        "200":
          description: Rotated WebAuth credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthCredentials"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/me:
    get:
      operationId: getWebAuthPrincipal
      summary: Read the current WebAuth principal
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
      responses:
        "200":
          description: Current WebAuth principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthPrincipal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/logout:
    post:
      operationId: logoutWebAuth
      summary: Revoke the current WebAuth session
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      responses:
        "204":
          description: Current WebAuth session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/password:
    post:
      operationId: replaceWebAuthPassword
      summary: Replace the current user's local password
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthPasswordReplaceRequest"
      responses:
        "200":
          description: Replacement WebAuth credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthCredentials"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/mfa:
    get:
      operationId: getWebAuthMFAStatus
      summary: Read the current user's MFA status
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
      responses:
        "200":
          description: Current MFA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthMFAStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: disableWebAuthMFA
      summary: Disable the current user's MFA factor
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthMFADisableRequest"
      responses:
        "200":
          description: Replacement WebAuth credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthCredentials"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/mfa/enable:
    post:
      operationId: beginWebAuthMFAEnable
      summary: Begin MFA enrollment
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthMFABeginRequest"
      responses:
        "200":
          description: MFA registration continuation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthMFAContinuation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/mfa/enable/finish:
    post:
      operationId: finishWebAuthMFAEnable
      summary: Finish MFA enrollment
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthMFAFinishRequest"
      responses:
        "200":
          description: Replacement WebAuth credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthCredentials"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/mfa/replace:
    post:
      operationId: beginWebAuthMFAReplace
      summary: Begin MFA factor replacement
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthMFAReplaceBeginRequest"
      responses:
        "200":
          description: MFA registration continuation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthMFAContinuation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/mfa/replace/finish:
    post:
      operationId: finishWebAuthMFAReplace
      summary: Finish MFA factor replacement
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthMFAFinishRequest"
      responses:
        "200":
          description: Replacement WebAuth credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthCredentials"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/sessions:
    get:
      operationId: listWebAuthSessions
      summary: List active WebAuth sessions
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: after_id
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Active WebAuth session page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthSessionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/sessions/{web_auth_session_id}/revoke:
    post:
      operationId: revokeWebAuthSession
      summary: Revoke one WebAuth session
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      parameters:
        - name: web_auth_session_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthSessionRevokeRequest"
      responses:
        "204":
          description: WebAuth session revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    operatorServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: OperatorToken
      description: Local service credential held by the Backoffice process.
    webAuthAccess:
      type: apiKey
      in: header
      name: X-Balda-WebAuth-Access
      description: Opaque WebAuth access credential forwarded by Backoffice.
    webAuthRefresh:
      type: apiKey
      in: header
      name: X-Balda-WebAuth-Refresh
      description: Opaque WebAuth refresh credential forwarded by Backoffice.
    csrf:
      type: apiKey
      in: header
      name: X-Balda-CSRF
      description: WebAuth-session-bound CSRF proof forwarded by Backoffice.
  responses:
    BadRequest:
      description: Invalid management request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ManagementError"
    Unauthorized:
      description: Missing or invalid service or WebAuth credential
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ManagementError"
    Forbidden:
      description: Authenticated request lacks authority or valid CSRF proof
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ManagementError"
    Conflict:
      description: Management request conflicts with current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ManagementError"
    NotFound:
      description: Requested management resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ManagementError"
    InternalError:
      description: Safe bounded internal failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ManagementError"
  schemas:
    ManagementCompatibility:
      type: object
      additionalProperties: false
      required:
        - contract_id
        - contract_version
        - api_major
      properties:
        contract_id:
          type: string
          enum:
            - balda.management.v1
        contract_version:
          type: string
          maxLength: 32
          example: 1.0.0
        api_major:
          type: integer
          format: int32
          enum:
            - 1
    LocalLoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
        - browser_context
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 4096
          writeOnly: true
        browser_context:
          $ref: "#/components/schemas/WebAuthBrowserContext"
    WebAuthBrowserContext:
      type: object
      additionalProperties: false
      required:
        - browser_binding
        - csrf_token
      properties:
        browser_binding:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
        csrf_token:
          type: string
          minLength: 16
          maxLength: 4096
          writeOnly: true
        device_label:
          type: string
          maxLength: 256
        connection_peer:
          type: string
          maxLength: 256
    WebAuthLoginResult:
      type: object
      additionalProperties: false
      required:
        - outcome
      properties:
        outcome:
          type: string
          enum:
            - authenticated
            - mfa_required
        credentials:
          $ref: "#/components/schemas/WebAuthCredentials"
        mfa:
          $ref: "#/components/schemas/WebAuthMFAContinuation"
    WebAuthLoginMFAFinishRequest:
      type: object
      additionalProperties: false
      required:
        - transaction_id
        - browser_binding
        - csrf_token
        - credential_response
      properties:
        transaction_id:
          type: string
          minLength: 1
          maxLength: 256
        browser_binding:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
        csrf_token:
          type: string
          minLength: 16
          maxLength: 4096
          writeOnly: true
        credential_response:
          type: string
          minLength: 2
          maxLength: 131072
          writeOnly: true
          description: Bounded serialized WebAuthn assertion response.
        device_label:
          type: string
          maxLength: 256
        connection_peer:
          type: string
          maxLength: 256
    WebAuthCredentials:
      type: object
      additionalProperties: false
      required:
        - access_token
        - refresh_token
        - csrf_token
        - access_expires_at
        - refresh_expires_at
        - assurance
      properties:
        access_token:
          type: string
          minLength: 1
          maxLength: 4096
          description: Sensitive opaque access credential returned only to the trusted BFF.
          x-sensitive: true
        refresh_token:
          type: string
          minLength: 1
          maxLength: 4096
          description: Sensitive opaque refresh credential returned only to the trusted BFF.
          x-sensitive: true
        csrf_token:
          type: string
          minLength: 1
          maxLength: 4096
          description: Sensitive CSRF proof returned only to the trusted BFF.
          x-sensitive: true
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
        assurance:
          $ref: "#/components/schemas/WebAuthAssurance"
    WebAuthPrincipal:
      type: object
      additionalProperties: false
      required:
        - user_id
        - username
        - display_name
        - role
        - assurance
        - access_expires_at
        - mfa_enabled
        - user_version
        - credential_version
        - mfa_version
        - web_auth_session_id
        - web_auth_session_version
      properties:
        user_id:
          type: string
          minLength: 1
          maxLength: 256
        username:
          type: string
          minLength: 1
          maxLength: 256
        display_name:
          type: string
          minLength: 1
          maxLength: 256
        role:
          $ref: "#/components/schemas/WebAuthRole"
        assurance:
          $ref: "#/components/schemas/WebAuthAssurance"
        access_expires_at:
          type: string
          format: date-time
        mfa_enabled:
          type: boolean
        user_version:
          type: integer
          format: uint64
          minimum: 1
        credential_version:
          type: integer
          format: uint64
          minimum: 1
        mfa_version:
          type: integer
          format: uint64
          minimum: 0
        web_auth_session_id:
          type: string
          minLength: 1
          maxLength: 256
        web_auth_session_version:
          type: integer
          format: uint64
          minimum: 1
    WebAuthPasswordReplaceRequest:
      type: object
      additionalProperties: false
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
          maxLength: 4096
          writeOnly: true
        new_password:
          type: string
          format: password
          minLength: 1
          maxLength: 4096
          writeOnly: true
    WebAuthMFAStatus:
      type: object
      additionalProperties: false
      required:
        - enabled
        - available
      properties:
        enabled:
          type: boolean
        available:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    WebAuthMFABeginRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - browser_binding
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 4096
          writeOnly: true
        browser_binding:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
    WebAuthMFAReplaceBeginRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - browser_binding
        - confirm
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 4096
          writeOnly: true
        browser_binding:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
        confirm:
          type: boolean
          enum:
            - true
    WebAuthMFAFinishRequest:
      type: object
      additionalProperties: false
      required:
        - transaction_id
        - browser_binding
        - credential_response
      properties:
        transaction_id:
          type: string
          minLength: 1
          maxLength: 256
        browser_binding:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
        credential_response:
          type: string
          minLength: 2
          maxLength: 131072
          writeOnly: true
          description: Bounded serialized WebAuthn registration response.
    WebAuthMFADisableRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - confirm
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 4096
          writeOnly: true
        confirm:
          type: boolean
          enum:
            - true
    WebAuthMFAContinuation:
      type: object
      additionalProperties: false
      required:
        - transaction_id
        - expires_at
        - public_key_options
      properties:
        transaction_id:
          type: string
          minLength: 1
          maxLength: 256
        expires_at:
          type: string
          format: date-time
        public_key_options:
          type: object
          additionalProperties: true
          description: Standards-shaped public WebAuthn options; never verifier material.
    WebAuthSessionSummary:
      type: object
      additionalProperties: false
      required:
        - web_auth_session_id
        - assurance
        - created_at
        - last_seen_at
        - refresh_expires_at
        - version
      properties:
        web_auth_session_id:
          type: string
          minLength: 1
          maxLength: 256
        assurance:
          $ref: "#/components/schemas/WebAuthAssurance"
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        device_label:
          type: string
          maxLength: 256
        connection_peer:
          type: string
          maxLength: 256
        version:
          type: integer
          format: uint64
          minimum: 1
    WebAuthSessionPage:
      type: object
      additionalProperties: false
      required:
        - sessions
      properties:
        sessions:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/WebAuthSessionSummary"
        next_after_id:
          type: string
          minLength: 1
          maxLength: 256
    WebAuthSessionRevokeRequest:
      type: object
      additionalProperties: false
      required:
        - confirm_current
      properties:
        confirm_current:
          type: boolean
    WebAuthRole:
      type: string
      enum:
        - administrator
        - operator
    WebAuthAssurance:
      type: string
      enum:
        - restricted
        - normal
    AISessionSummary:
      type: object
      additionalProperties: false
      required:
        - ai_session_id
        - status
        - observed_at
      properties:
        ai_session_id:
          type: string
          minLength: 1
          maxLength: 256
        label:
          type: string
          maxLength: 256
        status:
          type: string
          minLength: 1
          maxLength: 64
        channel_type:
          type: string
          maxLength: 64
        observed_at:
          type: string
          format: date-time
    ManagementResourceSummary:
      type: object
      additionalProperties: false
      required:
        - resource_id
        - resource_version
        - updated_at
      properties:
        resource_id:
          type: string
          minLength: 1
          maxLength: 256
        resource_version:
          type: integer
          format: uint64
          minimum: 1
        updated_at:
          type: string
          format: date-time
    ManagementError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z][a-z0-9_.-]*$"
        message:
          type: string
          minLength: 1
          maxLength: 512
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        fields:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/ManagementErrorField"
    ManagementErrorField:
      type: object
      additionalProperties: false
      required:
        - field
        - code
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 128
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z][a-z0-9_.-]*$"

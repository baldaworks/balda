openapi: 3.0.3
info:
  title: Balda Management API
  version: 1.10.0
  description: >-
    Contract for the loopback Balda management API. The API distinguishes
    browser WebAuth authority from AI conversation sessions.
paths:
  /api/management/v1/compatibility:
    get:
      operationId: getManagementCompatibility
      summary: Read management contract compatibility metadata
      security:
        - operatorServiceAuth: []
      responses:
        "200":
          description: Management contract metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementCompatibility"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/system/overview:
    get:
      operationId: getSystemOverview
      summary: Read configured integration capabilities
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
      responses:
        "200":
          description: Allowlisted configured integration capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/system/agent:
    get:
      operationId: getSystemAgent
      summary: Read the effective configured agent view
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
      responses:
        "200":
          description: Allowlisted effective agent configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemAgent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/login:
    post:
      operationId: loginWebAuth
      summary: Start local WebAuth login
      security:
        - operatorServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalLoginRequest"
      responses:
        "200":
          description: Login completed or requires an MFA continuation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthLoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/login/mfa:
    post:
      operationId: finishWebAuthLogin
      summary: Finish local WebAuth login with MFA
      security:
        - operatorServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthLoginMFAFinishRequest"
      responses:
        "200":
          description: Authenticated WebAuth credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthCredentials"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/refresh:
    post:
      operationId: refreshWebAuth
      summary: Rotate WebAuth credentials
      security:
        - operatorServiceAuth: []
          webAuthRefresh: []
          csrf: []
      responses:
        "200":
          description: Rotated WebAuth credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthCredentials"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/me:
    get:
      operationId: getWebAuthPrincipal
      summary: Read the current WebAuth principal
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
      responses:
        "200":
          description: Current WebAuth principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthPrincipal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/logout:
    post:
      operationId: logoutWebAuth
      summary: Revoke the current WebAuth session
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      responses:
        "204":
          description: Current WebAuth session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/password:
    post:
      operationId: replaceWebAuthPassword
      summary: Replace the current user's local password
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthPasswordReplaceRequest"
      responses:
        "200":
          description: Replacement WebAuth credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthCredentials"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/mfa:
    get:
      operationId: getWebAuthMFAStatus
      summary: Read the current user's MFA status
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
      responses:
        "200":
          description: Current MFA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthMFAStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: disableWebAuthMFA
      summary: Disable the current user's MFA factor
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthMFADisableRequest"
      responses:
        "200":
          description: Replacement WebAuth credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthCredentials"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/mfa/enable:
    post:
      operationId: beginWebAuthMFAEnable
      summary: Begin MFA enrollment
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthMFABeginRequest"
      responses:
        "200":
          description: MFA registration continuation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthMFAContinuation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/mfa/enable/finish:
    post:
      operationId: finishWebAuthMFAEnable
      summary: Finish MFA enrollment
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthMFAFinishRequest"
      responses:
        "200":
          description: Replacement WebAuth credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthCredentials"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/mfa/replace:
    post:
      operationId: beginWebAuthMFAReplace
      summary: Begin MFA factor replacement
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthMFAReplaceBeginRequest"
      responses:
        "200":
          description: MFA registration continuation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthMFAContinuation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/mfa/replace/finish:
    post:
      operationId: finishWebAuthMFAReplace
      summary: Finish MFA factor replacement
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthMFAFinishRequest"
      responses:
        "200":
          description: Replacement WebAuth credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthCredentials"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/sessions:
    get:
      operationId: listWebAuthSessions
      summary: List active WebAuth sessions
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: after_id
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Active WebAuth session page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthSessionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/auth/sessions/{web_auth_session_id}/revoke:
    post:
      operationId: revokeWebAuthSession
      summary: Revoke one WebAuth session
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      parameters:
        - name: web_auth_session_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthSessionRevokeRequest"
      responses:
        "204":
          description: WebAuth session revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/providers:
    get:
      operationId: listProviders
      summary: Read the current provider inventory
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
      responses:
        "200":
          description: Secret-free provider inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderInventory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createProvider
      summary: Create a managed provider
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCreateRequest"
      responses:
        "204":
          description: Provider created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/providers/{provider_id}:
    put:
      operationId: updateProvider
      summary: Replace the editable definition of a managed provider
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdateRequest"
      responses:
        "204":
          description: Provider updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteProvider
      summary: Tombstone a managed provider
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderDeleteRequest"
      responses:
        "204":
          description: Provider deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/providers/{provider_id}/selection:
    post:
      operationId: selectProvider
      summary: Enable or disable a managed provider
      security:
        - operatorServiceAuth: []
          webAuthAccess: []
          csrf: []
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderSelectionRequest"
      responses:
        "204":
          description: Provider selection changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/management/v1/schedules:
    get:
      operationId: listSchedules
      summary: Read the content-free schedule inventory
      security: [{ operatorServiceAuth: [], webAuthAccess: [] }]
      responses:
        "200": { description: Schedule inventory, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleInventory" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createSchedule
      summary: Create a managed schedule
      security: [{ operatorServiceAuth: [], webAuthAccess: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleCreateRequest" } } } }
      responses:
        "200": { description: Created schedule, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleItem" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/management/v1/schedules/{schedule_id}:
    get:
      operationId: getSchedule
      summary: Read one schedule including guarded content
      security: [{ operatorServiceAuth: [], webAuthAccess: [] }]
      parameters: [{ $ref: "#/components/parameters/ScheduleID" }]
      responses:
        "200": { description: Schedule detail, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleItem" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: updateSchedule
      summary: Replace a managed schedule definition
      security: [{ operatorServiceAuth: [], webAuthAccess: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ScheduleID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleUpdateRequest" } } } }
      responses:
        "200": { description: Updated schedule, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleItem" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteSchedule
      summary: Tombstone a managed schedule
      security: [{ operatorServiceAuth: [], webAuthAccess: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ScheduleID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleDeleteRequest" } } } }
      responses:
        "200": { description: Deleted schedule, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleItem" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/management/v1/schedules/{schedule_id}/selection:
    post:
      operationId: selectSchedule
      summary: Enable or disable a managed schedule
      security: [{ operatorServiceAuth: [], webAuthAccess: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ScheduleID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleSelectionRequest" } } } }
      responses:
        "200": { description: Current schedule, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleItem" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/management/v1/schedules/{schedule_id}/runs:
    get:
      operationId: listScheduleRuns
      summary: Read one bounded page of schedule run history
      security: [{ operatorServiceAuth: [], webAuthAccess: [] }]
      parameters:
        - { $ref: "#/components/parameters/ScheduleID" }
        - { name: before_at, in: query, schema: { type: string, format: date-time } }
        - { name: before_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Bounded schedule run page, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleRunPage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: runScheduleNow
      summary: Request one idempotent manual schedule run
      security: [{ operatorServiceAuth: [], webAuthAccess: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ScheduleID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleRunNowRequest" } } } }
      responses:
        "200": { description: Current durable run, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleRunItem" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/management/v1/schedules/{schedule_id}/runs/{run_id}:
    get:
      operationId: getScheduleRun
      summary: Read one schedule run with frozen input and output
      security: [{ operatorServiceAuth: [], webAuthAccess: [] }]
      parameters:
        - { $ref: "#/components/parameters/ScheduleID" }
        - { $ref: "#/components/parameters/ScheduleRunID" }
      responses:
        "200": { description: Schedule run detail, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleRunDetail" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/management/v1/aliases:
    get:
      operationId: listAliases
      security: [{ operatorServiceAuth: [], webAuthAccess: [] }]
      responses:
        "200": { description: Managed aliases, content: { application/json: { schema: { $ref: "#/components/schemas/AliasInventory" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createAlias
      security: [{ operatorServiceAuth: [], webAuthAccess: [], csrf: [] }]

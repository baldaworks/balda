components:
  securitySchemes:
    operatorServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: OperatorToken
      description: Local service credential held by the Backoffice process.
    webAuthAccess:
      type: apiKey
      in: header
      name: X-Balda-WebAuth-Access
      description: Opaque WebAuth access credential forwarded by Backoffice.
    webAuthRefresh:
      type: apiKey
      in: header
      name: X-Balda-WebAuth-Refresh
      description: Opaque WebAuth refresh credential forwarded by Backoffice.
    csrf:
      type: apiKey
      in: header
      name: X-Balda-CSRF
      description: WebAuth-session-bound CSRF proof forwarded by Backoffice.
  parameters:
    ProviderID:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    MCPConnectionID:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    MCPAttemptID:
      name: attempt_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ScheduleID:
      name: schedule_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ScheduleRunID:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookName:
      name: webhook_name
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$" }
    AliasName:
      name: alias_name
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    HookName:
      name: hook_name
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,63}$" }
    PluginName:
      name: plugin_name
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    PluginMarketplaceName:

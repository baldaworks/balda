      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    SkillID:
      name: skill_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    WebhookJobID:
      name: job_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
  responses:
    BadRequest:
      description: Invalid management request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ManagementError"
    Unauthorized:
      description: Missing or invalid service or WebAuth credential
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ManagementError"
    Forbidden:
      description: Authenticated request lacks authority or valid CSRF proof
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ManagementError"
    Conflict:
      description: Management request conflicts with current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ManagementError"
    NotFound:
      description: Requested management resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ManagementError"
    InternalError:
      description: Safe bounded internal failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ManagementError"
    ServiceUnavailable:
      description: Provider management dependency is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ManagementError"

package: managementv1
generate:
  models: true
  client: true
  std-http-server: true
  strict-server: true
  embedded-spec: true
compatibility:
  old-merge-schemas: false
  old-allof-sibling-merging: false
  preserve-original-operation-id-casing-in-embedded-spec: true
output-options:
  name-normalizer: ToCamelCaseWithInitialisms
  skip-prune: true
  additional-initialisms:
    - AI
    - API
    - CSRF
    - ID
    - MFA
    - URL
  response-type-suffix: Response
output: management.gen.go

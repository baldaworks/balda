name: test
on:
  workflow_dispatch:
    inputs:
      force-full:
        description: Run the full regression suite
        type: boolean
        default: false
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '17 3 * * *'
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backoffice: ${{ steps.classify.outputs.backoffice }}
      core: ${{ steps.classify.outputs.core }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_FULL: ${{ inputs.force-full || false }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch || "$FORCE_FULL" == true || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            printf 'M\tgo.mod\n' | ./scripts/ci/classify-changes.sh
          else
            git diff --name-status "$BASE_SHA" "$HEAD_SHA" | ./scripts/ci/classify-changes.sh
          fi

  backoffice-e2e:
    needs: changes
    if: needs.changes.outputs.backoffice == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: qa/backoffice-e2e/package-lock.json
      - name: Backoffice browser regression
        env:
          BALDA_BACKOFFICE_E2E_ARTIFACTS: ${{ runner.temp }}/balda-backoffice-e2e
        run: ./scripts/qa/run-backoffice-e2e.sh
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backoffice-e2e-failure-artifacts
          path: ${{ runner.temp }}/balda-backoffice-e2e
          if-no-files-found: warn

  backoffice-unit:
    needs: changes
    if: needs.changes.outputs.backoffice == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Backoffice build and unit tests
        run: go test -race ./cmd/backoffice ./internal/apps/backoffice/...

  sqlite-integration:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Validate SQLite Goose migrations
        run: go tool goose -dir internal/apps/balda/state/migrations validate
      - name: SQLite state integration
        env:
          BALDA_CI_TIMING_DIR: ${{ runner.temp }}/balda-ci-timing/sqlite
        run: ./scripts/ci/run-go-test-with-timing.sh sqlite
      - name: Upload SQLite timing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-integration-timing
          path: ${{ runner.temp }}/balda-ci-timing/sqlite
          if-no-files-found: warn

  postgres-integration:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_PASSWORD: balda-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Validate PostgreSQL Goose migrations
        run: go tool goose -dir internal/apps/balda/state/postgres_migrations validate
      - name: PostgreSQL state integration
        env:
          BALDA_TEST_POSTGRES_DSN: postgres://postgres:balda-test-only@localhost:5432/postgres?sslmode=disable
        run: go test -race -tags=integration,postgres ./internal/apps/balda/state

  test-shards:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: test-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Prepare test artifact workspace
        run: mkdir -p .tmp
      - name: Generate complete test shards
        env:
          TEST_MODE: ${{ needs.changes.outputs.full == 'true' && 'full' || 'core' }}
        run: ./scripts/ci/make-go-test-shards.sh .tmp/test-shards "$TEST_MODE"
      - name: Test shard ${{ matrix.shard }}
        env:
          TMPDIR: ${{ github.workspace }}/.tmp
          BALDA_CI_SHARD: ${{ matrix.shard }}
          BALDA_CI_PACKAGE_FILE: ${{ github.workspace }}/.tmp/test-shards/shard-${{ matrix.shard }}.txt
          BALDA_CI_TIMING_DIR: ${{ runner.temp }}/balda-ci-timing/test-shard-${{ matrix.shard }}
          BALDA_CI_COVERAGE_FILE: ${{ runner.temp }}/balda-ci-timing/test-shard-${{ matrix.shard }}/coverage.out
        run: ./scripts/ci/run-go-test-with-timing.sh test-shard
      - name: Retain shard inventory
        if: always()
        run: cp .tmp/test-shards/shard-${{ matrix.shard }}.txt ${{ runner.temp }}/balda-ci-timing/test-shard-${{ matrix.shard }}/packages.txt
      - name: Upload test shard artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/balda-ci-timing/test-shard-${{ matrix.shard }}
          if-no-files-found: warn
      - name: Upload shard failure state
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-shard-${{ matrix.shard }}-failure-state
          path: |
            .tmp/**/*.db
            .tmp/**/.config/balda/nats/**
          if-no-files-found: warn

  test:
    if: always()
    needs: [changes, backoffice-unit, backoffice-e2e, test-shards, sqlite-integration, postgres-integration, projection-replay, architecture-lint, jetstream-integration, ingress-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require selected test groups
        env:
          BACKOFFICE_SELECTED: ${{ needs.changes.outputs.backoffice }}
          BACKOFFICE_RESULT: ${{ needs.backoffice-unit.result }}
          CORE_SELECTED: ${{ needs.changes.outputs.core }}
          SHARD_RESULT: ${{ needs.test-shards.result }}
          BACKOFFICE_E2E_RESULT: ${{ needs.backoffice-e2e.result }}
          SQLITE_RESULT: ${{ needs.sqlite-integration.result }}
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
          PROJECTION_RESULT: ${{ needs.projection-replay.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture-lint.result }}
          JETSTREAM_RESULT: ${{ needs.jetstream-integration.result }}
          INGRESS_RESULT: ${{ needs.ingress-e2e.result }}
        run: |
          [[ "$BACKOFFICE_SELECTED" != true || "$BACKOFFICE_RESULT" == success ]]
          [[ "$BACKOFFICE_SELECTED" != true || "$BACKOFFICE_E2E_RESULT" == success ]]
          [[ "$CORE_SELECTED" != true || "$SHARD_RESULT" == success ]]
          [[ "$CORE_SELECTED" != true || "$SQLITE_RESULT" == success ]]
          [[ "$CORE_SELECTED" != true || "$POSTGRES_RESULT" == success ]]
          [[ "$CORE_SELECTED" != true || "$PROJECTION_RESULT" == success ]]
          [[ "$CORE_SELECTED" != true && "$BACKOFFICE_SELECTED" != true || "$ARCHITECTURE_RESULT" == success ]]
          [[ "$CORE_SELECTED" != true || "$JETSTREAM_RESULT" == success ]]
          [[ "$CORE_SELECTED" != true || "$INGRESS_RESULT" == success ]]
      - uses: actions/checkout@v5
        if: needs.changes.outputs.core == 'true'
      - uses: actions/setup-go@v6
        if: needs.changes.outputs.core == 'true'
        with:
          go-version-file: 'go.mod'
      - name: Verify management OpenAPI generation
        if: needs.changes.outputs.core == 'true'
        run: ./scripts/ci/check-management-openapi.sh
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.core == 'true'
        with:
          name: test-shard-0
          path: .tmp/test-shards/0
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.core == 'true'
        with:
          name: test-shard-1
          path: .tmp/test-shards/1
      - name: Verify inventory and merge atomic coverage
        if: needs.changes.outputs.core == 'true'
        run: |
          cat .tmp/test-shards/0/packages.txt .tmp/test-shards/1/packages.txt | LC_ALL=C sort > .tmp/test-shards/actual.txt
          if [[ "${{ needs.changes.outputs.full }}" == true ]]; then
            go list ./... | LC_ALL=C sort > .tmp/test-shards/expected.txt
          else
            go list ./... | grep -Ev '^github\.com/baldaworks/balda/(cmd/backoffice|internal/apps/backoffice)(/|$)' | LC_ALL=C sort > .tmp/test-shards/expected.txt
          fi
          cmp .tmp/test-shards/expected.txt .tmp/test-shards/actual.txt
          test "$(sort .tmp/test-shards/actual.txt | uniq -d | wc -l)" -eq 0
          ./scripts/ci/merge-go-coverprofiles.sh coverage.out .tmp/test-shards/0/coverage.out .tmp/test-shards/1/coverage.out
          cat .tmp/test-shards/0/timing.md .tmp/test-shards/1/timing.md >> "$GITHUB_STEP_SUMMARY"
      - name: Vulnerability check
        if: needs.changes.outputs.full == 'true'
        run: |
          set -o pipefail
          go tool govulncheck ./... 2>&1 | tee test.log
      - name: Upload aggregation failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failure-artifacts
          path: |
            test.log
            .tmp/test-shards
          if-no-files-found: warn
      - name: Upload coverage artifact
        if: needs.changes.outputs.core == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage.out
          path: coverage.out
          if-no-files-found: error
      - name: Upload coverage to Codecov
        if: needs.changes.outputs.core == 'true' && github.event_name != 'pull_request'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.out
          fail_ci_if_error: false
          use_oidc: true

  projection-replay:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Projection replay tests
        run: go test -race -count=15 ./internal/apps/balda/jobs -run '^TestEventProjectorReplayAfterRestartRemainsIdempotent$'

  architecture-lint:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.backoffice == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Architecture lint
        run: go tool go-arch-lint check --project-path .

  jetstream-integration:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Embedded JetStream integration tests
        run: go test -race ./internal/apps/balda/eventbus/nats

  ingress-e2e:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Webhook, scheduler, and goal E2E tests
        run: go test -race ./internal/apps/balda/channel/webhook ./internal/apps/balda/webhookapp ./internal/apps/balda/scheduledjobs ./internal/apps/balda/actors/command/goalkeeper

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: fast
  disable:
    - gomoddirectives
    - wsl
    - wsl_v5
    - depguard
    - nlreturn
    - lll
    - mnd
    - funlen
    - gocognit
    - cyclop
    - nestif
    - godoclint
    - testpackage
    - interfacebloat
    - gocyclo
    - maintidx
    - embeddedstructfieldcheck
    - funcorder
    - tagalign
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - misspell
    - unconvert
    - goconst
    - gocritic
    - whitespace
    - nolintlint
    - forbidigo
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^state\.New(SQLite|Postgres)Provider$'
          pkg: '^github\.com/baldaworks/balda/internal/apps/balda/state$'
          msg: 'Use state.Open with resolved database configuration in production composition.'
        - pattern: '^session\.Manager\.(GetSession|EnsureSession|RestoreSession|CreateSession|TakeStartupNotice)$'
          pkg: '^github\.com/baldaworks/balda/internal/apps/balda/session$'
          msg: 'Ordinary conversational presentation must consume the shared SessionPreparer outcome.'
        - pattern: '^appports\.TurnQueue\.Enqueue$'
          pkg: '^github\.com/baldaworks/balda/internal/apps/balda/appports$'
          msg: 'Ordinary FIFO admission is owned only by SessionActor and modelapp.'
        - pattern: '^actors\.TurnDispatcher\.Enqueue$'
          pkg: '^github\.com/baldaworks/balda/internal/apps/balda/actors$'
          msg: 'Ordinary FIFO admission is owned only by SessionActor and modelapp.'
        - pattern: '^appports\.ReplacementQueue\.EnqueueReplacement$'
          pkg: '^github\.com/baldaworks/balda/internal/apps/balda/appports$'
          msg: 'Replacement FIFO admission is owned only by lifetimeapp.'
        - pattern: '^actors\.TurnDispatcher\.EnqueueReplacement$'
          pkg: '^github\.com/baldaworks/balda/internal/apps/balda/actors$'
          msg: 'Replacement FIFO admission is owned only by lifetimeapp.'
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path-except: 'internal/apps/balda/handlersfx/conversational_sessions\.go$'
        text: 'Ordinary conversational presentation must consume'
        linters: [forbidigo]
      - path: 'internal/apps/balda/state/|_test\.go$'
        linters: [forbidigo]
      - path: 'internal/apps/balda/(actors/session_actor|modelapp/service)\.go$'
        text: 'Ordinary FIFO admission is owned only'
        linters: [forbidigo]
      - path: 'internal/apps/balda/lifetimeapp/service\.go$'
        text: 'Replacement FIFO admission is owned only'
        linters: [forbidigo]

formatters:
  enable: []
  settings: {}

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

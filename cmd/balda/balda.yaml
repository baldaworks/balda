# Balda Bot Configuration
# Environment variables override these settings with BALDA_ prefix
# Example: BALDA_TELEGRAM_TOKEN=my-token

balda:
  # Provider id from runtime providers registry used for Balda sessions.
  provider: ""

  # Agent tool permission policy: allow_all, ask, or deny_all.
  # allow_all preserves the historical behavior; production deployments should prefer ask.
  permissions:
    mode: "allow_all"
    timeout: "2m"

  telegram:
    # Telegram bot token (required)
    # Set via BALDA_TELEGRAM_TOKEN env var
    token: ""
    # Formatting mode for outbound Telegram text.
    # Slack/Zulip use their own channel-native Markdown delivery and do not use this setting.
    # - rich_markdown: model writes Markdown/plain text; balda sends Telegram rich Markdown (default)
    # - rich_html: model writes rich-message HTML; balda sends Telegram rich HTML
    # - none: literal plain text without parse_mode
    # Unsupported values fail startup before ingress becomes ready.
    formatting_mode: "rich_markdown"
    # Surface work-plan updates in balda progress.
    # - true: DM thinking placeholders show plan snapshots; public chats/topics receive plain-text plan messages
    # - false: plan progress stays hidden; balda still emits progress activity and keeps typing / Thinking... behavior
    plan_updates: true

    # Optional webhook configuration
    webhook:
      # Optional Telegram registration URL. When empty in webhook mode, use
      # balda.http.base_url + balda.http.base_path + /gateway/telegram/webhook.
      url: ""
      # Telegram webhook auth token protection.
      # Required when webhook.enabled=true.
      auth_token: ""
      # Enable local HTTP endpoint for incoming Telegram webhook updates.
      # If false, balda uses polling mode.
      enabled: false
      # Legacy bind setting; balda.http.listen_addr owns the shared socket.
      listen_addr: "0.0.0.0:8080"
      # Exact legacy callback alias alongside /gateway/telegram/webhook.
      path: "/telegram/webhook"

  zulip:
    # Zulip bot email (required when webhook.enabled=true)
    # Set via BALDA_ZULIP_BOT_EMAIL env var
    bot_email: ""
    # Zulip bot API key (required when webhook.enabled=true)
    # Set via BALDA_ZULIP_API_KEY env var
    api_key: ""
    # Zulip server URL (e.g. https://zulip.qentra.top)
    # Set via BALDA_ZULIP_SERVER_URL env var
    server_url: ""
    # Webhook authentication token — must match the token Zulip sends in the payload.
    # Copy it from the bot's outgoing webhook configuration in Zulip.
    # Set via BALDA_ZULIP_WEBHOOK_TOKEN env var
    webhook_token: ""
    webhook:
      # Enable inbound Zulip webhook receiver.
      # New callbacks use <base_path>/gateway/zulip/webhook on the shared listener.
      # Set via BALDA_ZULIP_WEBHOOK_ENABLED env var
      enabled: false
      # Legacy bind setting; balda.http.listen_addr owns the shared socket.
      # Set via BALDA_ZULIP_WEBHOOK_LISTEN_ADDR env var
      listen_addr: "0.0.0.0:8090"
      # Exact legacy callback alias.
      # Set via BALDA_ZULIP_WEBHOOK_PATH env var
      path: "/zulip/webhook"

  mattermost:
    # Mattermost slash commands arrive over shared HTTP, separate from
    # websocket events. Register /gateway/mattermost/commands beneath the
    # configured base_path with the token the integration shows you.
    commands_enabled: false
    # Legacy bind setting; balda.http.listen_addr owns the shared socket.
    commands_listen_addr: ":8093"
    # Exact legacy slash-command alias; must start with "/".
    commands_path: "/mattermost/commands"
    # Mattermost slash-command token used to authenticate incoming requests.
    commands_token: ""
    # Mattermost bot-account transport over the v4 websocket/REST API.
    # Enable to connect this bot account and receive channel/DM events.
    # Set via BALDA_MATTERMOST_ENABLED env var
    enabled: false
    # Mattermost server base URL (e.g. https://mm.example.com).
    # Set via BALDA_MATTERMOST_SERVER_URL env var
    server_url: ""
    # Bot account personal access token.
    # Set via BALDA_MATTERMOST_TOKEN env var
    token: ""
    # Bot account user id, used to ignore the bot's own posts.
    # Set via BALDA_MATTERMOST_BOT_USER_ID env var
    bot_user_id: ""
    # Bot username, used for @mention detection in channels.
    # Set via BALDA_MATTERMOST_BOT_USERNAME env var
    bot_username: ""

  slack:
    # Enable inbound Slack HTTP receiver.
    # Slack's public Request URLs should terminate HTTPS outside Balda and forward
    # plain HTTP to these local endpoints.
    enabled: false
    # Slack bot token (xoxb-...)
    # Set via BALDA_SLACK_BOT_TOKEN env var
    bot_token: ""
    # Slack signing secret used to verify incoming Events API and slash requests.
    # Set via BALDA_SLACK_SIGNING_SECRET env var
    signing_secret: ""
    # Legacy bind setting; balda.http.listen_addr owns the shared socket.
    listen_addr: "0.0.0.0:8091"
    # Retained Slack Events setting; Slack Agent uses agent.events_path.
    events_path: "/slack/events"
    # Exact legacy /balda slash-command alias. Slack Agent routes these into
    # the shared transport-neutral command handler.
    commands_path: "/slack/commands"
    # If true, process private channel message events when the Slack app has
    # groups:history. Public channel and DM support does not require this.
    include_private_channels: false
    agent:
      # Enable separate Slack AI Agents ingress/runtime wiring.
      # This is distinct from balda.slack.enabled, which keeps the current Slack chat mode.
      enabled: false
      # Legacy bind setting; balda.http.listen_addr owns the shared socket.
      listen_addr: "0.0.0.0:8092"
      # Exact legacy Slack Agent Events alias.
      events_path: "/slack/agent/events"
      # Optional richer UX toggles. These do not affect current slack_chat behavior.
      enable_streaming: false
      suggested_prompts: false

  webhooks:
    # Enable generic inbound webhook ingestion.
    enabled: false
    # Legacy bind setting; balda.http.listen_addr owns the shared socket.
    listen_addr: "127.0.0.1:8090"
    # Route table for inbound webhook events.
    # Keys are immutable URL slugs: ^[a-z0-9][a-z0-9_-]{0,63}$.
    # Every config and managed route uses <balda.http.base_path>/webhooks/<name>.
    # Do not declare path; even disabled declarations fail startup if it is present.
    # Each route defines:
    # - prompt_template: Go text/template rendered with request data
    # - envelope: optional final report destination
    #   - report_to.target: locator|managed_alias|alias
    #   - report_to.key: public locator or managed/role alias name
    #   - ack_on_delivery: wait for a sent final report receipt
    # - auth: route auth policy
    #   - type: none|header
    #   - header/value: required for type=header
    # - dedupe: route dedupe policy
    #   - source: request_id|header|body_sha256
    #   - header: required for source=header
    # Available template fields: RequestID, Path, Method, RawBody, Headers
    # Example:
    # routes:
    #   release_notes:
    #     prompt_template: |
    #       Request {{.RequestID}} on {{.Path}}
    #       Body:
    #       {{.RawBody}}
    #     envelope:
    #       report_to:
    #         target: "managed_alias"
    #         key: "main_chat"
    #     auth:
    #       type: "header"
    #       header: "X-Webhook-Token"
    #       secret_env: "BALDA_RELEASE_WEBHOOK_TOKEN"
    #     dedupe:
    #       source: "header"
    #       header: "X-Delivery-ID"
    routes: {}

  logger:
    level: "info"
    pretty: true

  # Optional repo/root directory for Balda runtime.
  # If empty, current process directory is used.
  working_dir: ""

  # Balda app state directory.
  # Supplies the default SQLite location and local NATS/artifact paths.
  # Relative paths are resolved from balda.working_dir.
  state_dir: ".config/balda"

  database:
    type: sqlite
    sqlite:
      path: '{{.StateDir}}/state.db'
    postgres:
      host: localhost
      port: 5432
      name: balda
      user: balda
      password: ""
      sslmode: disable

  # One local HTTP bind and one public origin/prefix for sibling
  # /backoffice, /webhooks, and /gateway areas. Values fall back to the old
  # Backoffice address settings when omitted.
  http:
    listen_addr: ""
    base_url: ""
    base_path: null

  # Backoffice starts inside `balda start` after schema/data migrations and user
  # readiness, using the same database and canonical users as the bot.
  backoffice:
    # Legacy fallback address fields. Use balda.http.* for new deployments.
    # A non-loopback shared bind requires an HTTPS public origin.
    listen_addr: "127.0.0.1:8095"
    public_url: "http://127.0.0.1:8095"
    # Opaque access credentials are short-lived. Single-use rotating refresh
    # credentials renew the session-family deadline on successful refresh.
    access_token_ttl: "15m"
    refresh_token_ttl: "720h"
    ceremony_ttl: "5m"
    qa_ui: false

  sessions:
    # Conversation/session persistence:
    # - sqlite: durable runtime conversation state in the selected database (default)
    # - memory: keep runtime conversation state in memory only
    persistence: "sqlite"

  memory:
    # Internal durable memory backed by the selected state database.
    # Existing ${balda.state_dir}/MEMORY.md content is imported once when KV memory is empty.
    # If false, balda.memory.* MCP tools are disabled.
    enabled: true

  # Optional native durable session-memory export/search integration. This is
  # independent from the global fact memory above and remains disabled unless
  # explicitly enabled. Producer ingress is persisted in state.db before
  # JetStream PubAck; Norma performs bounded isolated derivation.
  session_memory:
    enabled: false
    # Optional provider ID from runtime.providers for isolated fact extraction.
    # Empty uses balda.provider for compatibility; the selected provider's
    # model and reasoning_effort apply only to session-memory extraction.
    # Omit reasoning_effort in that provider entry for no explicit reasoning.
    provider: ""
    # Explicit typed provider-tool names eligible for durable capture.
    trusted_tools: []
    derivation:
      timeout: "30s"
      max_output_bytes: 262144
    stream: "BALDA_SESSION_MEMORY"
    consumer: "BALDA_SESSION_MEMORY_WORKER"
    ack_wait: "5m"
    fetch_wait: "1s"
    publish_timeout: "2s"
    publish_attempts: 3
    max_age: "7d"
    max_bytes: "-1"
    max_msg_size: "-1"
    max_concurrent_scopes: 4
    max_queued_per_scope: 32
    search_timeout: "5s"
    retry:
      max_attempts: 5
      base_delay: "250ms"
      max_delay: "5s"
      progress_interval: "30s"
      fetch_error_delay: "100ms"
      shutdown_timeout: "30s"

  features:
    automode:
      # Consecutive synthetic auto-turn cap for /auto continuation chains.
      # Balda clamps invalid values to 5.
      max_turns: 10
    attachments:
      # Maximum files accepted from one inbound message.
      max_files_per_message: 10
      # Maximum bytes accepted for one inbound file (25 MiB).
      max_file_bytes: 26214400
      # Maximum bytes accepted across one inbound message (50 MiB).
      max_total_bytes: 52428800
      store:
        # Attachment store engine:
        # - off: do not persist inbound attachments
        # - local: save inbound attachments under ${balda.state_dir}/attachments
        engine: "local"

  goal:
    # /goal worker-validator loop iteration cap.
    # Balda clamps invalid values to 25.
    max_iterations: 25

  nats:
    # Required built-in command/event runtime.
    embedded: true
    host: "127.0.0.1"
    port: -1
    max_memory: "256mb"
    max_store: "2gb"
    sync_always: false
    expose_monitoring: false

  swarm: {}

  scheduler:
    # Startup-reconciled recurring jobs.
    # Jobs are upserted by id on boot; missing ids are deleted from state.db.
    # Jobs use cron syntax (5 fields) or cron descriptors like @every 10m.
    # By default, scheduled turns are fire-and-forget. Set envelope.report_to to send progress/final replies.
    # Example:
    # jobs:
    #   - id: "owner-daily-summary"
    #     cron: "0 9 * * *"
    #     envelope:
    #       target: "alias"
    #       key: "owner"
    #       content: "Summarize repository status."
    #       report_to:
    #         target: "alias"
    #         key: "owner"
    jobs: []

  workspace:
    # Workspace mode:
    # - on: always use git worktrees per session
    # - off: run agents in balda working_dir directly
    # - auto: use worktrees only when working_dir is a git repo
    # In on mode, balda fails fast if working_dir is not a git repository.
    mode: "auto"
    # Base branch used for workspace branching/import/export.
    # If empty, balda resolves from current HEAD branch at startup.
    base_branch: ""
    # Workspace directory name under balda.state_dir used for per-session worktrees.
    sessions_dir: "sessions"

  # Extra MCP server IDs (from runtime.mcp_servers) injected into every balda-started session.
  # Effective MCP IDs are: bundled default `balda` + agent mcp_servers + balda.mcp_servers.
  # Use the built-in `balda` server ID for Balda workspace/state tools.
  mcp_servers: []
  mcp_management:
    credential_key: ""

  # Optional balda-wide global instruction applied to all sessions.
  # Applied before runtime.providers.<provider_id>.system_instructions when both are set.
  global_instruction: ""

  # Trusted host extensions may add bounded sections to the session instruction.
  # Zero uses the default total contribution budget of 1 MiB.
  session_instructions:
    max_total_bytes: 0
